{% extends 'HRservices/layout.html' %}

{% block content %}
<div class="min-h-screen bg-[#0f0f1a] py-16 px-4">

    <!-- FORM -->
    <div class="max-w-3xl mx-auto bg-[#1a1a2e] p-8 rounded-xl shadow-lg border border-white/10">

        <h2 class="text-3xl font-semibold text-center text-white mb-8">
            Contact Us
        </h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Name -->
            <div>
                <label class="text-gray-400 text-sm">Name</label>
                <input type="text" name="name"
                    class="w-full mt-2 bg-black/30 text-white p-3 rounded-lg border border-white/10 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none">
            </div>

            <!-- Email -->
            <div>
                <label class="text-gray-400 text-sm">Email</label>
                <input type="email" name="email"
                    class="w-full mt-2 bg-black/30 text-white p-3 rounded-lg border border-white/10 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none">
            </div>

            <!-- Message -->
            <div>
                <label class="text-gray-400 text-sm">Message</label>
                <textarea name="message" rows="4"
                    class="w-full mt-2 bg-black/30 text-white p-3 rounded-lg border border-white/10 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none"></textarea>
            </div>

            <!-- Button -->
            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-medium transition">
                Send Message
            </button>

        </form>
    </div>


    <!-- CONTACT DETAILS -->
    <div class="max-w-3xl mx-auto mt-12 bg-[#1a1a2e] p-8 rounded-xl border border-white/10 text-center">

        <h3 class="text-2xl text-white mb-6">Contact Details</h3>

        <div class="space-y-4 text-gray-400">

            <p>
                <span class="text-white">Email:</span>
                <a href="mailto:prashant@stemhrservices.com" class="text-purple-400 hover:underline">
                    prashant@stemhrservices.com
                </a>
            </p>

            <!-- <p>
                <span class="text-white">Phone:</span>
                <a href="tel:+919876543210" class="text-purple-400 hover:underline">
                    +91 98765 43210
                </a>
            </p> -->

            <p>
                <span class="text-white">Address:</span>
                Pune, Maharashtra, India
            </p>

        </div>
    </div>


    <!-- MAP -->
    <div class="mt-12 max-w-3xl mx-auto rounded-xl overflow-hidden border border-white/10">

        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d242147.9396935807!2d73.70981075975142!3d18.50350875953021!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf2e67461101%3A0x828d43bf9d9ee343!2sPune%2C%20Maharashtra%2C%20India!5e0!3m2!1sen!2sus!4v1777820094782!5m2!1sen!2sus"         
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>


    </div>

</div>
{% endblock %}
