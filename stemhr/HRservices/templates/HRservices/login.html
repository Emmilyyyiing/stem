{% extends 'HRservices/layout.html' %}

{% block content %}

<div class="min-h-screen bg-[#0f0f1a] py-16 px-4 flex items-center justify-center">

    <div class="w-full max-w-md bg-[#1a1a2e] p-8 rounded-xl border border-white/10 shadow-lg">

        <h2 class="text-2xl font-semibold text-white text-center mb-8">
            Admin Login
        </h2>

        <form method="post" class="space-y-6 text-left">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label class="block text-sm text-gray-400 mb-1">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        <p class="text-red-400 text-xs mt-1">
                            {{ field.errors }}
                        </p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit"
                class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg transition">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
